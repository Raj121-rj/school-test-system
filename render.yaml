# Render Blueprint: Render Dashboard > New > Blueprint > select this repository.
# Plans below are PAID (recommended for a real school). For a trial you may set both plans to "free"
# (free PostgreSQL is deleted ~30 days after creation, and a free web service sleeps when idle).
databases:
  - name: school-test-db
    databaseName: school_tests
    user: school_tests
    plan: basic-256mb
    region: singapore
    ipAllowList: []        # only allow internal connections from the web service

services:
  - type: web
    name: school-test-system
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev && npm run check
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render asks you for this value when you create the Blueprint
      - key: SEED_DEMO
        value: "true"        # demo accounts + sample marks; delete them from Admin > Settings before real use
      - key: SCHOOL_TZ
        value: Asia/Kolkata
